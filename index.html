<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Institute Management System</title>
<style>
:root{
  --bg:#eef5fb;--card:#ffffff;--text:#12263f;--muted:#5d7189;--border:#d8e5f1;--input-bg:#f6fafd;--th-bg:#e9f3fa;--row-alt:#f7fbfe;--row-hover:#e8f4fb;
  --accent:#0b8fb8;--accent2:#4f6bed;--danger:#d93a3a;--shadow:0 6px 20px rgba(15,76,129,.09);
  --ok-bg:#d9f5ec;--ok-fg:#0b7a5a;--bad-bg:#fde3e3;--bad-fg:#b42323;--warn-bg:#fff1d6;--warn-fg:#946000;--muted-bg:#e4ecf4;--muted-fg:#5d7189;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1523;--card:#13233a;--text:#e6f0fa;--muted:#8fa6bf;--border:#24384f;--input-bg:#0f1c2e;--th-bg:#18304b;--row-alt:#112036;--row-hover:#1a3350;
--accent:#2bb3dd;--accent2:#7c8cff;--danger:#f87171;--shadow:0 6px 20px rgba(0,0,0,.35);
--ok-bg:#0f3d33;--ok-fg:#5eead4;--bad-bg:#4a1d24;--bad-fg:#fca5a5;--warn-bg:#4a3a14;--warn-fg:#fcd34d;--muted-bg:#223650;--muted-fg:#a9bdd3; } }
:root[data-theme="dark"]{ --bg:#0b1523;--card:#13233a;--text:#e6f0fa;--muted:#8fa6bf;--border:#24384f;--input-bg:#0f1c2e;--th-bg:#18304b;--row-alt:#112036;--row-hover:#1a3350;
--accent:#2bb3dd;--accent2:#7c8cff;--danger:#f87171;--shadow:0 6px 20px rgba(0,0,0,.35);
--ok-bg:#0f3d33;--ok-fg:#5eead4;--bad-bg:#4a1d24;--bad-fg:#fca5a5;--warn-bg:#4a3a14;--warn-fg:#fcd34d;--muted-bg:#223650;--muted-fg:#a9bdd3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;font-size:14px;}
header{padding:14px 18px;background:linear-gradient(115deg,#0b3b6f 0%,#0b8fb8 55%,#19c3c1 100%);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(11,59,111,.25);}
.brand{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto;}
.logo{font-size:24px;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;line-height:1;}
header h1{margin:0;font-size:17px;letter-spacing:.2px}
header p{margin:2px 0 0;color:rgba(255,255,255,.85);font-size:11.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);}
nav button{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px;white-space:nowrap;transition:all .15s;}
nav button:hover{background:var(--row-hover);color:var(--text);}
nav button.active{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(11,143,184,.35);}
main{padding:16px 16px 48px;max-width:960px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
.card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}
.card h2::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--grad);flex:0 0 auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
input,select,textarea{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:13px;margin-bottom:8px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,143,184,.18);}
button.btn{padding:8px 16px;border-radius:9px;border:none;background:var(--grad);color:#fff;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 3px 10px rgba(11,143,184,.28);transition:filter .15s,transform .05s;}
button.btn:hover{filter:brightness(1.08);}
button.btn:active{transform:translateY(1px);}
button.btn.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent);box-shadow:none;}
button.btn.secondary:hover{background:var(--row-hover);}
button.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:4px 9px;font-size:11.5px;box-shadow:none;}
button.btn.small{padding:4px 9px;font-size:11.5px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--muted);font-weight:700;background:var(--th-bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;}
tr:nth-child(even) td{background:var(--row-alt);}
tr:hover td{background:var(--row-hover);}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:600;background:var(--muted-bg);color:var(--muted-fg);}
.pill-ok{background:var(--ok-bg);color:var(--ok-fg);}
.pill-bad{background:var(--bad-bg);color:var(--bad-fg);}
.pill-warn{background:var(--warn-bg);color:var(--warn-fg);}
.pill-muted{background:var(--muted-bg);color:var(--muted-fg);}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.stat{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--c,var(--accent));border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);}
.stat b{display:block;font-size:18px;color:var(--c,var(--accent));}
.stat span{font-size:10.5px;color:var(--muted);}
.stat:nth-child(1){--c:#0b8fb8}.stat:nth-child(2){--c:#4f6bed}.stat:nth-child(3){--c:#14b8a6}.stat:nth-child(4){--c:#3b82f6}
.stat:nth-child(5){--c:#06b6d4}.stat:nth-child(6){--c:#7c6df0}.stat:nth-child(7){--c:#10b981}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px;}
.small{font-size:11px;color:var(--muted);}
.thumb{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid var(--border);}
.cb-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.cb-item{border:1px solid var(--border);border-radius:9px;padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:6px;background:var(--input-bg);}
.cb-item input[type=checkbox]{width:auto;margin:0;}
.inactive-row{opacity:.5;}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.filters input,.filters select{margin:0;flex:1 1 150px;width:auto;min-width:130px;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-bottom:14px;background:var(--card);}
.seg button{border:0;background:transparent;padding:8px 16px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;}
.seg button.on{background:var(--grad);color:#fff;}
.sigbox{margin-top:26px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.sigbox div{min-width:200px;border-top:1px solid var(--muted);padding-top:6px;font-size:12px;color:var(--muted);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header><div class="brand"><span class="logo">🎓</span><div><h1>Institute Management System</h1><p>TechLife IT Academy · Sathima · BEETOT English Medium Pre School</p></div></div></header>
<nav id="tabs"></nav>
<main id="app"></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYJKPszgZeTtxde-zoEr11hT5eTzBRgyY",
  authDomain: "sathimatechlifebeetot.firebaseapp.com",
  projectId: "sathimatechlifebeetot",
  storageBucket: "sathimatechlifebeetot.firebasestorage.app",
  messagingSenderId: "269981321925",
  appId: "1:269981321925:web:a5f9fcdea0d5642342feac"
};
const fbApp = initializeApp(firebaseConfig);
const fsdb = getFirestore(fbApp);

const INSTITUTES = ["TechLife IT Academy","Sathima","BEETOT English Medium Pre School"];
const OLD_INSTITUTE_NAME = "Sathima Education Institute";
function renameInstituteIfNeeded(kind){
  if(kind==='classes'){ DB.classes.filter(c=>c.institute===OLD_INSTITUTE_NAME).forEach(c=>{ c.institute='Sathima'; }); }
  if(kind==='staff'){ DB.staff.filter(s=>(s.institutes||[]).includes(OLD_INSTITUTE_NAME)).forEach(s=>{ s.institutes=s.institutes.map(i=>i===OLD_INSTITUTE_NAME?'Sathima':i); }); }
}
const COLLECTION_KEYS = ['classes','teachers','students','staff','attendance','tpay','exp','income','admissions'];
let DB={}, REMOTE={}; COLLECTION_KEYS.forEach(k=>{ DB[k]=[]; REMOTE[k]=[]; });
let SETTINGS={admissionFee:500, defaultShare:80, adminPassword:'admin123', directorName:''};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function save(kind){
  const remoteList=REMOTE[kind]||[]; const localList=DB[kind]; const ops=[];
  const localIds=new Set(localList.map(r=>r.id));
  remoteList.forEach(r=>{ if(!localIds.has(r.id)) ops.push(deleteDoc(doc(fsdb,kind,r.id))); });
  localList.forEach(r=>{ const old=remoteList.find(x=>x.id===r.id);
    if(!old || JSON.stringify(old)!==JSON.stringify(r)) ops.push(setDoc(doc(fsdb,kind,r.id), r));
  });
  const all=Promise.all(ops);
  all.catch(e=>notify('Could not sync '+kind+': '+(e&&e.message||'try again')));
  return all;
}
function saveSettings(){ const pr=setDoc(doc(fsdb,'settings','main'), SETTINGS); pr.catch(()=>notify('Could not save settings.')); return pr; }
function safeRerender(){ const ae=document.activeElement; if(!ae||(ae.tagName!=='INPUT'&&ae.tagName!=='SELECT'&&ae.tagName!=='TEXTAREA')) render(); }
COLLECTION_KEYS.forEach(k=>{
  onSnapshot(collection(fsdb,k), snap=>{
    const list=snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    REMOTE[k]=list; DB[k]=list.map(r=>Object.assign({},r)); if(k==='attendance'&&active==='attendance'&&attRefresh) attRefresh(); else safeRerender();
    if(k==='classes'||k==='staff'){ const before=JSON.stringify(DB[k]); renameInstituteIfNeeded(k); if(JSON.stringify(DB[k])!==before) save(k); }
  }, err=>notify('Sync error ('+k+'): '+err.message));
});
onSnapshot(doc(fsdb,'settings','main'), snap=>{
  if(snap.exists()) SETTINGS=Object.assign({admissionFee:500, defaultShare:80, adminPassword:'admin123', directorName:''}, snap.data());
  safeRerender();
}, err=>notify('Sync error (settings): '+err.message));

function genNo(prefix, arr){ let max=0; arr.forEach(x=>{ const m=(x.no||'').match(/(\d+)$/); if(m) max=Math.max(max,parseInt(m[1])); }); return prefix+String(max+1).padStart(4,'0'); }
function age(dob){ if(!dob) return ''; const d=new Date(dob), n=new Date(); let a=n.getFullYear()-d.getFullYear(); const m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate())) a--; return a; }
function money(n){ return 'Rs. '+(Number(n)||0).toLocaleString(); }
function notify(msg){ let t=document.getElementById('__toast'); if(!t){ t=el('div',{id:'__toast'}); t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;max-width:85%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .25s;'; document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(t._timer); t._timer=setTimeout(()=>{ t.style.opacity='0'; },Math.max(2500,msg.length*70)); }
function showSavedDialog(message, promise){
  const overlay=el('div'); overlay.style.cssText='position:fixed;inset:0;background:rgba(8,20,36,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;';
  const box=el('div',{class:'card'}); box.style.cssText='max-width:380px;width:100%;margin:0;text-align:center;';
  const icon=el('div'); icon.style.cssText='font-size:34px;line-height:1;margin-bottom:6px;'; icon.textContent='⏳';
  const title=el('h2'); title.style.justifyContent='center'; title.textContent='Saving…';
  const msg=el('p'); msg.style.cssText='font-size:13px;margin:6px 0 14px;'; msg.textContent=message;
  const ok=el('button',{class:'btn'},'OK'); ok.disabled=true;
  const close=()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  ok.onclick=close;
  box.appendChild(icon); box.appendChild(title); box.appendChild(msg); box.appendChild(ok); overlay.appendChild(box); document.body.appendChild(overlay);
  let done=false;
  const slow=setTimeout(()=>{ if(done) return; msg.textContent=message+' (Still saving — it will finish automatically when the connection is back. You can close this.)'; ok.disabled=false; },6000);
  Promise.resolve(promise).then(()=>{ done=true; clearTimeout(slow); icon.textContent='✅'; title.textContent='Saved'; msg.textContent=message; ok.disabled=false; ok.focus(); })
    .catch(e=>{ done=true; clearTimeout(slow); icon.textContent='⚠️'; title.textContent='Could not save'; msg.textContent=(e&&e.message)||'Please check your connection and try again.'; ok.disabled=false; });
}
function confirmAdmin(label,onOk){
  const overlay=el('div'); overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;';
  const box=el('div',{class:'card'}); box.style.cssText='max-width:320px;width:100%;margin:0;';
  box.appendChild(el('h2',{},'Admin Password Required'));
  box.appendChild(el('p',{class:'small'},'Enter the admin password to '+label+'.'));
  const pwd=el('input',{type:'password',placeholder:'Password'});
  const err=el('p',{class:'small'},'Incorrect password.'); err.style.cssText='color:var(--danger);display:none;';
  box.appendChild(pwd); box.appendChild(err);
  const row=el('div',{class:'row'});
  const okBtn=el('button',{class:'btn',onclick:()=>{ if(pwd.value===SETTINGS.adminPassword){ document.body.removeChild(overlay); onOk(); } else { err.style.display='block'; pwd.value=''; pwd.focus(); } }},'Confirm');
  const cancelBtn=el('button',{class:'btn secondary',onclick:()=>document.body.removeChild(overlay)},'Cancel');
  pwd.addEventListener('keydown',e=>{ if(e.key==='Enter') okBtn.click(); });
  row.appendChild(okBtn); row.appendChild(cancelBtn); box.appendChild(row);
  overlay.appendChild(box); document.body.appendChild(overlay); pwd.focus();
}
function triggerDownload(filename, blob){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
function makePrintableNode(bodyHtml){
  const node=el('div',{class:'print-capture'});
  node.style.cssText='position:fixed;left:-10000px;top:0;background:#ffffff;color:#111111;padding:24px;width:820px;font-family:Arial,Helvetica,sans-serif;';
  node.innerHTML='<style>.print-capture h1{font-size:18px;margin:0 0 4px} .print-capture h2{font-size:13px;color:#444;margin:14px 0 4px} .print-capture table{width:100%;border-collapse:collapse;margin-bottom:10px} .print-capture th,.print-capture td{border:1px solid #ccc;padding:5px 7px;text-align:left;font-size:12px} .print-capture th{background:#f0f0f0}</style>'+bodyHtml;
  document.body.appendChild(node); return node;
}
function exportReport(filename, bodyHtml, format){
  if(typeof html2canvas==='undefined'){ notify('Export library still loading — try again in a moment.'); return; }
  const node=makePrintableNode(bodyHtml);
  html2canvas(node,{scale:2, backgroundColor:'#ffffff'}).then(canvas=>{
    document.body.removeChild(node);
    if(format==='jpg'){
      canvas.toBlob(blob=>{ triggerDownload(filename+'.jpg', blob); notify('Image downloaded.'); }, 'image/jpeg', 0.92);
    } else {
      if(typeof window.jspdf==='undefined'){ notify('PDF library still loading — try again.'); return; }
      const {jsPDF}=window.jspdf; const w=canvas.width/2, h=canvas.height/2;
      const pdf=new jsPDF({orientation:w>h?'l':'p', unit:'pt', format:[w,h]});
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,w,h);
      triggerDownload(filename+'.pdf', pdf.output('blob')); notify('PDF downloaded.');
    }
  }).catch(()=>notify('Could not generate the export.'));
}
function normalizeEnrollments(student){ if(student.enrollments) return student.enrollments; return (student.classIds||[]).map(id=>({classId:id,level:'',monthlyFee:'',dailyFee:''})); }
function getEnrollment(student,classId){ return normalizeEnrollments(student).find(e=>e.classId===classId); }
function isEnrolled(student,classId){ return normalizeEnrollments(student).some(e=>e.classId===classId); }
function getFee(student,classId,source){ const en=getEnrollment(student,classId); const c=DB.classes.find(x=>x.id===classId); if(source==='Monthly Fee') return en&&en.monthlyFee!=='' && en.monthlyFee!=null ? Number(en.monthlyFee) : Number(c?c.monthlyFee:0)||0; if(source==='Daily Fee') return en&&en.dailyFee!=='' && en.dailyFee!=null ? Number(en.dailyFee) : Number(c?c.dailyFee:0)||0; return 0; }
function daysUntilBirthday(dob){
  if(!dob) return null;
  const d=new Date(dob); if(isNaN(d)) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  let next=new Date(today.getFullYear(), d.getMonth(), d.getDate());
  if(next<today) next=new Date(today.getFullYear()+1, d.getMonth(), d.getDate());
  return Math.round((next-today)/86400000);
}
function upcomingBirthdays(windowDays){
  const list=[];
  [['teachers','Teacher'],['students','Student'],['staff','Staff']].forEach(([kind,label])=>{
    DB[kind].filter(p=>p.status!=='inactive').forEach(p=>{ const d=daysUntilBirthday(p.dob); if(d!==null && d<=windowDays) list.push({p,kind:label,days:d}); });
  });
  return list.sort((a,b)=>a.days-b.days);
}

function el(tag,attrs={},...kids){ const e=document.createElement(tag); for(const k in attrs){ if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } kids.forEach(k=>e.appendChild(typeof k==='string'?document.createTextNode(k):k)); return e; }

/* Reusable search + sortable-column table. headers: [{label, key, sortable}]. rows: array of data objects.
   searchText(row) -> string to match against the search box. cellsFor(row) -> array of td contents (string or node), same order/length as headers.
   sortVal(row,key) -> value used for sorting that column (defaults to row[key]). */
const TABLE_STATES={};
function renderFilterSortTable(container, opts){
  const {id, headers, rows, searchText, cellsFor, sortVal, rowClass, emptyText, filters}=opts;
  container.innerHTML='';
  const sid=id||'_default';
  const state = TABLE_STATES[sid] || (TABLE_STATES[sid]={q:'', sortKey:null, sortDir:1, f:{}});
  const bar=el('div',{class:'filters'});
  const searchInp=el('input',{type:'text',placeholder:'Search...',value:state.q});
  searchInp.oninput=()=>{ state.q=searchInp.value; draw(); };
  bar.appendChild(searchInp);
  (filters||[]).forEach(f=>{
    let ctl;
    if(f.type==='month'){ ctl=el('input',{type:'month'}); ctl.value=state.f[f.key]||''; const w=el('div',{style:'flex:1 1 150px;min-width:130px'}); const lb=el('label',{},f.label); w.appendChild(lb); w.appendChild(ctl); ctl.style.width='100%'; ctl.onchange=()=>{ state.f[f.key]=ctl.value; draw(); }; bar.appendChild(w); return; }
    ctl=el('select'); ctl.appendChild(el('option',{value:''},f.label+': All')); f.options.forEach(o=>ctl.appendChild(el('option',{value:o.value},o.label))); ctl.value=state.f[f.key]||'';
    ctl.onchange=()=>{ state.f[f.key]=ctl.value; draw(); };
    bar.appendChild(ctl);
  });
  if((filters||[]).length){ bar.appendChild(el('button',{class:'btn small secondary',onclick:()=>{ state.q=''; state.f={}; renderFilterSortTable(container,opts); }},'Clear filters')); }
  container.appendChild(bar);
  const countEl=el('div',{class:'small',style:'margin-bottom:6px'}); container.appendChild(countEl);
  const tw=el('div',{class:'tablewrap'}); container.appendChild(tw);
  function draw(){
    tw.innerHTML='';
    const tbl=el('table');
    const hr=el('tr');
    headers.forEach(hd=>{
      const label = hd.label + (hd.sortable && state.sortKey===hd.key ? (state.sortDir===1?' ▲':' ▼') : '');
      const th=el('th',{},label);
      if(hd.sortable){ th.style.cursor='pointer'; th.onclick=()=>{ if(state.sortKey===hd.key) state.sortDir=-state.sortDir; else { state.sortKey=hd.key; state.sortDir=1; } draw(); }; }
      hr.appendChild(th);
    });
    tbl.appendChild(hr);
    let list = rows.filter(r=> (!state.q || (searchText(r)||'').toLowerCase().includes(state.q.toLowerCase())) && (filters||[]).every(f=>!state.f[f.key]||f.test(r,state.f[f.key])) );
    if(state.sortKey){ list=list.slice().sort((a,b)=>{
      const av=sortVal?sortVal(a,state.sortKey):(a[state.sortKey]||''); const bv=sortVal?sortVal(b,state.sortKey):(b[state.sortKey]||'');
      if(av<bv) return -1*state.sortDir; if(av>bv) return 1*state.sortDir; return 0; }); }
    countEl.textContent='Showing '+list.length+' of '+rows.length;
    if(!list.length){ tbl.appendChild(el('tr',{},el('td',{colspan:String(headers.length)},emptyText||'No records found.'))); }

/* month helpers + pay-in-order rule */
function nextMonth(ym){ let [y,m]=ym.split('-').map(Number); m++; if(m>12){ m=1; y++; } return y+'-'+String(m).padStart(2,'0'); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'}); }
function firstUnsettledMonthBefore(student,classId,target){
  const recs=DB.income.filter(e=>e.studentId===student.id&&e.classId===classId&&(e.source==='Monthly Fee'||e.source==='Skipped')&&e.forMonth);
  if(!recs.length) return null;
  const earliest=recs.map(e=>e.forMonth).sort()[0];
  if(earliest>=target) return null;
  const required=getFee(student,classId,'Monthly Fee');
  let m=earliest;
  while(m<target){
    const paid=recs.filter(e=>e.forMonth===m&&e.source==='Monthly Fee').reduce((a,e)=>a+Number(e.amount),0);
    const skipped=recs.some(e=>e.forMonth===m&&e.source==='Skipped');
    if(!skipped && required>0 && paid<required) return m;
    m=nextMonth(m);
  }
  return null;
}

const PILL_MAP={paid:'ok',present:'ok',active:'ok',due:'bad',absent:'bad',inactive:'muted',partial:'warn',skipped:'muted',unmarked:'muted'};
function decoratePills(root){ root.querySelectorAll('.pill:not([data-d])').forEach(p=>{ p.dataset.d='1'; const k=PILL_MAP[p.textContent.trim().toLowerCase()]; if(k) p.classList.add('pill-'+k); }); }

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{
      const maxDim=320; let w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } } else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.6));
    }; img.onerror=reject; img.src=reader.result; };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function photoInput(current, onLoad){

  inp.onchange=async ()=>{

    statusEl.textContent=' Processing...';

    catch(e){ statusEl.textContent=''; notify('Could not process photo.'); }
  };
  wrap.appendChild(prev); wrap.appendChild(inp); wrap.appendChild(statusEl);
  wrap._setPreview=(v)=>{ prev.src=v||''; prev.style.display=v?'inline-block':'none'; };

}

function viewAttendance(){

  card.appendChild(grid);

  function fillTeachers(){
    const cur=ATT_STATE.teacher; teacherSel.innerHTML=''; teacherSel.appendChild(el('option',{value:''},'All teachers'));
    DB.teachers.filter(t=>DB.classes.some(c=>c.teacherId===t.id&&(!instSel.value||c.institute===instSel.value))).sort((a,b)=>(a.firstName||'').localeCompare(b.firstName||'')).forEach(t=>teacherSel.appendChild(el('option',{value:t.id},t.firstName+' '+(t.lastName||''))));
    teacherSel.value=Array.from(teacherSel.options).some(o=>o.value===cur)?cur:'';
  }
  function fillClasses(){
    const cur=ATT_STATE.cls; classSel.innerHTML='';
    const list=DB.classes.filter(c=>(!instSel.value||c.institute===instSel.value)&&(!teacherSel.value||c.teacherId===teacherSel.value));
    if(!list.length) classSel.appendChild(el('option',{value:''},'— no matching subjects —'));
    list.forEach(c=>classSel.appendChild(el('option',{value:c.id},(instSel.value?'':c.institute+': ')+c.name)));
    classSel.value=list.some(c=>c.id===cur)?cur:(list[0]?list[0].id:'');
  }
  function mark(personId,personType,classId,date,status){
    const idx=DB.attendance.findIndex(a=>a.personId===personId&&a.date===date&&a.classId===classId);
    if(idx>=0) DB.attendance[idx].status=status; else DB.attendance.push({id:uid(),personId,personType,classId:classId||null,date,status});
    syncState(); save('attendance'); renderList(); notify(personName(personType,personId)+' marked '+status+'.');
  }
  function renderList(){
    const y=window.scrollY||0;
    listDiv.innerHTML=''; const date=dateInput.value; const tbl=el('table');
    tbl.appendChild(el('tr',{},el('th',{},'Name'),el('th',{},'Status'),el('th',{},'')));
    const isStaff=typeSel.value==='Staff';
    ['inst','teacher','cls'].forEach(k=>{ wrappers[k].style.display=isStaff?'none':''; });
    let people=[];
    if(isStaff){ people=DB.staff.filter(s=>s.status!=='inactive').map(s=>({p:s,type:'staff',classId:null})); }
    else { const c=DB.classes.find(x=>x.id===classSel.value); if(c){ const t=DB.teachers.find(x=>x.id===c.teacherId); if(t) people.push({p:t,type:'teacher',classId:c.id});
      DB.students.filter(s=>s.status!=='inactive'&&isEnrolled(s,c.id)).forEach(s=>people.push({p:s,type:'student',classId:c.id})); } }
    const q=searchInp.value.toLowerCase();
    if(q) people=people.filter(({p})=> (p.firstName+' '+(p.lastName||'')).toLowerCase().includes(q));
    people.forEach(({p,type,classId})=>{ const existing=DB.attendance.find(a=>a.personId===p.id&&a.date===date&&a.classId===classId); const status=existing?existing.status:'unmarked';
      const tr=el('tr'); tr.appendChild(el('td',{},(type==='teacher'?'👨‍🏫 ':'')+p.firstName+' '+(p.lastName||'')));
      tr.appendChild(el('td',{},el('span',{class:'pill'},status)));

      const td=el('td',{}); td.appendChild(btns); tr.appendChild(td); tbl.appendChild(tr); });
    listDiv.appendChild(tbl);
    window.scrollTo(0,y);
  }
  typeSel.onchange=()=>{ syncState(); renderList(); };
  instSel.onchange=()=>{ syncState(); fillTeachers(); fillClasses(); syncState(); renderList(); };
  teacherSel.onchange=()=>{ syncState(); fillClasses(); syncState(); renderList(); };
  classSel.onchange=()=>{ syncState(); renderList(); };
  dateInput.onchange=()=>{ syncState(); renderList(); };
  searchInp.oninput=()=>{ syncState(); renderList(); };
  typeSel.value=ATT_STATE.mode; instSel.value=ATT_STATE.inst;
  fillTeachers(); fillClasses(); syncState();
  attRefresh=renderList; renderList();
  return wrap;
}

      headers:[{label:'Subject / Class',key:'cls',sortable:true},{label:'Role',key:'role',sortable:true},{label:'Name',key:'name',sortable:true},{label:'Status',key:'status',sortable:true}],
      filters:[{label:'Role',key:'role',options:roleOpts,test:(r,v)=>r.type===v},{label:'Subject / Class',key:'cls',options:classOpts,test:(r,v)=>r.classId===v},{label:'Status',key:'st',options:[{value:'present',label:'Present'},{value:'absent',label:'Absent'}],test:(r,v)=>r.status===v}],
      searchText:r=>[r.name,r.role,r.cls,r.status].join(' '),
      cellsFor:r=>[r.cls,r.role,r.name,el('span',{class:'pill'},r.status)]
    });
    let body='<h1>Daily Attendance Report — '+date+'</h1><table><tr><th>Subject / Class</th><th>Role</th><th>Name</th><th>Status</th></tr>';
    rows.forEach(r=>{ body+='<tr><td>'+r.cls+'</td><td>'+r.role+'</td><td>'+r.name+'</td><td>'+capWord(r.status)+'</td></tr>'; });
    if(!rows.length) body+='<tr><td colspan="4">No attendance was marked on this date.</td></tr>';
    body+='</table>';
    const byCls={}; rows.forEach(r=>{ const o=byCls[r.cls]||(byCls[r.cls]={present:0,absent:0}); if(r.status==='present') o.present++; else if(r.status==='absent') o.absent++; });
    const sumTw=el('div',{class:'tablewrap',style:'margin-top:12px'}); const sumTbl=el('table');
    sumTbl.appendChild(el('tr',{},el('th',{},'Summary — Subject / Class'),el('th',{},'Present'),el('th',{},'Absent')));
    let sumHtml='<h2>Summary</h2><table><tr><th>Subject / Class</th><th>Present</th><th>Absent</th></tr>';
    Object.keys(byCls).sort().forEach(k=>{ sumTbl.appendChild(el('tr',{},el('td',{},k),el('td',{},String(byCls[k].present)),el('td',{},String(byCls[k].absent)))); sumHtml+='<tr><td>'+k+'</td><td>'+byCls[k].present+'</td><td>'+byCls[k].absent+'</td></tr>'; });
    sumTbl.appendChild(el('tr',{},el('td',{},el('b',{},'TOTAL ('+rows.length+' marked)')),el('td',{},el('b',{},String(present))),el('td',{},el('b',{},String(absent)))));
    sumHtml+='<tr><td><b>TOTAL ('+rows.length+' marked)</b></td><td><b>'+present+'</b></td><td><b>'+absent+'</b></td></tr></table>';
    sumTw.appendChild(sumTbl); dOut.appendChild(sumTw); body+=sumHtml;
    const btnRow=el('div',{class:'row',style:'margin-top:10px'});
    btnRow.appendChild(el('button',{class:'btn secondary',onclick:()=>exportReport('attendance-daily-'+date, body, 'jpg')},'Download as JPEG'));
    btnRow.appendChild(el('button',{class:'btn secondary',onclick:()=>exportReport('attendance-daily-'+date, body, 'pdf')},'Download as PDF'));
    dOut.appendChild(btnRow);
  }
  dateInput.onchange=renderDaily; renderDaily();

  /* monthly */
  const mCard=el('div',{class:'card'}); mCard.appendChild(el('h2',{},'Monthly Attendance Report'));
  const monthInput=el('input',{type:'month',value:new Date().toISOString().slice(0,7)}); const mH=el('div'); mH.appendChild(el('label',{},'Month')); mH.appendChild(monthInput); mCard.appendChild(mH);
  const mOut=el('div'); mCard.appendChild(mOut); wrap.appendChild(mCard);
  function renderMonthly(){
    mOut.innerHTML=''; const mp=monthInput.value;
    const recs=DB.attendance.filter(a=>(a.date||'').startsWith(mp));
    const map={};
    recs.forEach(a=>{ const key=a.personType+'|'+a.personId+'|'+(a.classId||'');
      const o=map[key]||(map[key]={type:a.personType,id:a.personId,classId:a.classId||'',present:0,absent:0});
      if(a.status==='present') o.present++; else if(a.status==='absent') o.absent++; });
    const rows=Object.values(map).map(o=>{ const total=o.present+o.absent; const c=DB.classes.find(x=>x.id===o.classId);
      return {name:personName(o.type,o.id), type:o.type, role:capWord(o.type), classId:o.classId, cls:c?c.institute+': '+c.name:'General (staff)', present:o.present, absent:o.absent, total, pct: total?Math.round(o.present*100/total):0}; });
    rows.sort((a,b)=>a.cls.localeCompare(b.cls)||a.role.localeCompare(b.role)||a.name.localeCompare(b.name));
    const daysMarked=new Set(recs.map(a=>a.date)).size;
    mOut.appendChild(el('p',{class:'small'},monthLabel(mp)+'  ·  Days with attendance marked: '+daysMarked+'  ·  People/classes listed: '+rows.length));
    const host=el('div'); mOut.appendChild(host);
    const pctPill=pct=>el('span',{class:'pill '+(pct>=85?'pill-ok':pct>=60?'pill-warn':'pill-bad')},pct+'%');
    renderFilterSortTable(host,{
      id:'att-monthly', rows, emptyText:'No attendance was marked in this month.',
      headers:[{label:'Subject / Class',key:'cls',sortable:true},{label:'Role',key:'role',sortable:true},{label:'Name',key:'name',sortable:true},{label:'Present',key:'present',sortable:true},{label:'Absent',key:'absent',sortable:true},{label:'Total',key:'total',sortable:true},{label:'Attendance %',key:'pct',sortable:true}],
      filters:[{label:'Role',key:'role',options:roleOpts,test:(r,v)=>r.type===v},{label:'Subject / Class',key:'cls',options:classOpts,test:(r,v)=>r.classId===v}],
      searchText:r=>[r.name,r.role,r.cls].join(' '),
      sortVal:(r,k)=> ['present','absent','total','pct'].includes(k)?r[k]:(r[k]||''),
      cellsFor:r=>[r.cls,r.role,r.name,String(r.present),String(r.absent),String(r.total),pctPill(r.pct)]
    });
    let body='<h1>Monthly Attendance Report — '+monthLabel(mp)+'</h1><p>Days with attendance marked: '+daysMarked+'</p><table><tr><th>Subject / Class</th><th>Role</th><th>Name</th><th>Present</th><th>Absent</th><th>Total</th><th>Attendance %</th></tr>';
    rows.forEach(r=>{ body+='<tr><td>'+r.cls+'</td><td>'+r.role+'</td><td>'+r.name+'</td><td>'+r.present+'</td><td>'+r.absent+'</td><td>'+r.total+'</td><td>'+r.pct+'%</td></tr>'; });
    if(!rows.length) body+='<tr><td colspan="7">No attendance was marked in this month.</td></tr>';
    body+='</table>';
    const btnRow=el('div',{class:'row',style:'margin-top:10px'});
    btnRow.appendChild(el('button',{class:'btn secondary',onclick:()=>exportReport('attendance-monthly-'+mp, body, 'jpg')},'Download as JPEG'));
    btnRow.appendChild(el('button',{class:'btn secondary',onclick:()=>exportReport('attendance-monthly-'+mp, body, 'pdf')},'Download as PDF'));
    mOut.appendChild(btnRow);
  }
  monthInput.onchange=renderMonthly; renderMonthly();

  /* per-student report (daily / monthly) */
  const sCard=el('div',{class:'card'}); sCard.appendChild(el('h2',{},'Student Attendance Report — daily / monthly'));
  const sGrid=el('div',{class:'grid'});
  const sInst=el('select'); sInst.appendChild(el('option',{value:''},'All institutes')); INSTITUTES.forEach(i=>sInst.appendChild(el('option',{value:i},i)));
  const sClass=el('select'); const sStudent=el('select');
  const sMode=el('select'); [['daily','Daily — day by day'],['monthly','Monthly summary — whole year']].forEach(([v,l])=>sMode.appendChild(el('option',{value:v},l)));
  const sMonth=el('input',{type:'month',value:STUDENT_REP.month||new Date().toISOString().slice(0,7)});
  const sYear=el('input',{type:'number',min:'2000',max:'2100',value:STUDENT_REP.year||String(new Date().getFullYear())});
  const monthWrap=el('div'); monthWrap.appendChild(el('label',{},'Month')); monthWrap.appendChild(sMonth);
  const yearWrap=el('div'); yearWrap.appendChild(el('label',{},'Year')); yearWrap.appendChild(sYear);
  [['Institute',sInst],['Subject / Class (optional)',sClass],['Student',sStudent],['Report type',sMode]].forEach(([l,i])=>{ const d=el('div'); d.appendChild(el('label',{},l)); d.appendChild(i); sGrid.appendChild(d); });
  sGrid.appendChild(monthWrap); sGrid.appendChild(yearWrap); sCard.appendChild(sGrid);
  const sOut=el('div'); sCard.appendChild(sOut); wrap.appendChild(sCard);
  const keepOpt=(sel,val)=>{ sel.value=Array.from(sel.options).some(o=>o.value===val)?val:''; };
  function syncRep(){ STUDENT_REP.inst=sInst.value; STUDENT_REP.cls=sClass.value; STUDENT_REP.stu=sStudent.value; STUDENT_REP.mode=sMode.value; STUDENT_REP.month=sMonth.value; STUDENT_REP.year=sYear.value; }
  function fillClasses(){ sClass.innerHTML=''; sClass.appendChild(el('option',{value:''},'All subjects')); DB.classes.filter(c=>!sInst.value||c.institute===sInst.value).forEach(c=>sClass.appendChild(el('option',{value:c.id},(sInst.value?'':c.institute+': ')+c.name))); keepOpt(sClass,STUDENT_REP.cls); }
  function fillStudents(){ sStudent.innerHTML=''; sStudent.appendChild(el('option',{value:''},'— choose a student —'));
    DB.students.filter(s=>{ const en=normalizeEnrollments(s); if(sClass.value) return en.some(e=>e.classId===sClass.value); if(sInst.value) return en.some(e=>{ const c=DB.classes.find(x=>x.id===e.classId); return c&&c.institute===sInst.value; }); return true; })
      .sort((a,b)=>(a.firstName||'').localeCompare(b.firstName||'')).forEach(s=>sStudent.appendChild(el('option',{value:s.id},s.no+' - '+s.firstName+' '+(s.lastName||''))));
    keepOpt(sStudent,STUDENT_REP.stu); }
  function renderStudent(){
    sOut.innerHTML=''; monthWrap.style.display=sMode.value==='daily'?'':'none'; yearWrap.style.display=sMode.value==='monthly'?'':'none';
    const s=DB.students.find(x=>x.id===sStudent.value);
    if(!s){ sOut.appendChild(el('p',{class:'small'},'Choose a student to see their attendance.')); return; }
    const clsName=id=>{ const c=DB.classes.find(x=>x.id===id); return c?c.name:'—'; };
    const pctOf=(pp,tt)=>tt?Math.round(pp*100/tt):0;
    const recsAll=DB.attendance.filter(a=>a.personType==='student'&&a.personId===s.id&&(!sClass.value||a.classId===sClass.value));
    const insts=[...new Set(normalizeEnrollments(s).map(e=>{ const c=DB.classes.find(x=>x.id===e.classId); return c?c.institute:''; }).filter(Boolean))].join(', ');
    const subjLabel=sClass.value?clsName(sClass.value):'All subjects';
    let period, headers, bodyRows, present=0, absent=0;
    if(sMode.value==='daily'){
      const mp=sMonth.value; period=monthLabel(mp);
      const recs=recsAll.filter(a=>(a.date||'').startsWith(mp)).sort((a,b)=>a.date.localeCompare(b.date)||clsName(a.classId).localeCompare(clsName(b.classId)));
      headers=['Date','Day','Subject / Class','Status'];
      bodyRows=recs.map(a=>{ if(a.status==='present') present++; else if(a.status==='absent') absent++; return [a.date, new Date(a.date+'T00:00:00').toLocaleDateString('en',{weekday:'short'}), clsName(a.classId), a.status]; });
    } else {
      const yr=String(sYear.value||new Date().getFullYear()); period=yr;
      const map={};
      recsAll.filter(a=>(a.date||'').startsWith(yr+'-')).forEach(a=>{ const m=a.date.slice(0,7); const key=m+'|'+(a.classId||''); const o=map[key]||(map[key]={m,cid:a.classId||'',p:0,a:0}); if(a.status==='present'){ o.p++; present++; } else if(a.status==='absent'){ o.a++; absent++; } });
      headers=['Month','Subject / Class','Present','Absent','Total','Attendance %'];
      bodyRows=Object.values(map).sort((x,y)=>x.m.localeCompare(y.m)||clsName(x.cid).localeCompare(clsName(y.cid))).map(o=>[monthLabel(o.m), clsName(o.cid), String(o.p), String(o.a), String(o.p+o.a), pctOf(o.p,o.p+o.a)+'%']);
    }
    const total=present+absent;
    sOut.appendChild(el('p',{class:'small'},s.no+' — '+s.firstName+' '+(s.lastName||'')+(insts?'  ·  '+insts:'')+'  ·  '+subjLabel+'  ·  '+period));
    const tw=el('div',{class:'tablewrap'}); const tbl=el('table');
    const hr=el('tr'); headers.forEach(x=>hr.appendChild(el('th',{},x))); tbl.appendChild(hr);
    if(!bodyRows.length) tbl.appendChild(el('tr',{},el('td',{colspan:String(headers.length)},'No attendance was marked for this student in this period.')));
    bodyRows.forEach(r=>{ const tr=el('tr'); r.forEach((c,i)=>tr.appendChild(el('td',{}, (sMode.value==='daily'&&i===3)?el('span',{class:'pill'},c):c))); tbl.appendChild(tr); });
    tw.appendChild(tbl); sOut.appendChild(tw);
    const stats=el('div',{class:'statgrid',style:'margin-top:12px'}); stats.appendChild(stat(present,'Present')); stats.appendChild(stat(absent,'Absent')); stats.appendChild(stat(total,'Total marked')); stats.appendChild(stat(pctOf(present,total)+'%','Attendance')); sOut.appendChild(stats);
    if(sMode.value==='daily') sOut.appendChild(el('p',{class:'small'},'Only days on which attendance was marked are listed.'));
    let body='<h1>Student Attendance — '+s.firstName+' '+(s.lastName||'')+' ('+s.no+')</h1><p>'+(insts?insts+' &nbsp;·&nbsp; ':'')+subjLabel+' &nbsp;·&nbsp; '+period+'</p><table><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
    bodyRows.forEach(r=>{ body+='<tr>'+r.map((c,i)=>'<td>'+((sMode.value==='daily'&&i===3)?capWord(c):c)+'</td>').join('')+'</tr>'; });
    if(!bodyRows.length) body+='<tr><td colspan="'+headers.length+'">No attendance was marked for this student in this period.</td></tr>';
    body+='</table><p><b>Present: '+present+' &nbsp; Absent: '+absent+' &nbsp; Total marked: '+total+' &nbsp; Attendance: '+pctOf(present,total)+'%</b></p>';
    const fname='attendance-student-'+s.no+'-'+period;
    const btnRow=el('div',{class:'row',style:'margin-top:10px'});
    btnRow.appendChild(el('button',{class:'btn secondary',onclick:()=>exportReport(fname, body, 'jpg')},'Download as JPEG'));
    btnRow.appendChild(el('button',{class:'btn secondary',onclick:()=>exportReport(fname, body, 'pdf')},'Download as PDF'));
    sOut.appendChild(btnRow);
  }
  sInst.onchange=()=>{ syncRep(); fillClasses(); syncRep(); fillStudents(); syncRep(); renderStudent(); };
  sClass.onchange=()=>{ syncRep(); fillStudents(); syncRep(); renderStudent(); };
  sStudent.onchange=()=>{ syncRep(); renderStudent(); };
  sMode.onchange=()=>{ syncRep(); renderStudent(); }; sMonth.onchange=sMode.onchange; sYear.onchange=sMode.onchange;
  sInst.value=STUDENT_REP.inst; fillClasses(); fillStudents(); sMode.value=STUDENT_REP.mode; renderStudent();
  return wrap;
}

/* ---------- BACKUP / RESTORE (JSON export-import, e.g. from the earlier claude.ai version) ---------- */
function exportAllDataJson(){
  const payload={}; COLLECTION_KEYS.forEach(k=>payload[k]=DB[k]); payload.settings=SETTINGS;
  const blob=new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  triggerDownload('institute-system-backup-'+new Date().toISOString().slice(0,10)+'.json', blob);
}
async function importDataJson(file, onDone){
  try{
    const text=await file.text(); const payload=JSON.parse(text);
    let count=0;
    for(const k of COLLECTION_KEYS){
      const list=payload[k]||[];
      for(const rec of list){ if(!rec.id) rec.id=uid(); await setDoc(doc(fsdb,k,rec.id), rec); count++; }
    }
    if(payload.settings) await setDoc(doc(fsdb,'settings','main'), Object.assign({admissionFee:500,defaultShare:80,adminPassword:'admin123', directorName:''}, payload.settings));
    onDone(null,count);
  }catch(e){ onDone(e,0); }
}

/* ---------- SETTINGS ---------- */
function viewSettings(){
  const wrap=el('div');
  const backupCard=el('div',{class:'card'}); backupCard.appendChild(el('h2',{},'Backup & Restore'));
  backupCard.appendChild(el('p',{class:'small'},'Export a full backup anytime, or import a backup file (including one exported from an earlier version of this system) to load its data in here.'));
  backupCard.appendChild(el('button',{class:'btn secondary',onclick:exportAllDataJson},'Export All Data (JSON)'));
  const importInp=el('input',{type:'file',accept:'.json',style:'margin-top:8px'});
  const importStatus=el('p',{class:'small'},'');
  backupCard.appendChild(importInp);
  backupCard.appendChild(el('button',{class:'btn secondary',onclick:()=>{
    const f=importInp.files[0]; if(!f){ notify('Choose a JSON file first'); return; }
    importStatus.textContent='Importing...';
    importDataJson(f,(err,count)=>{ importStatus.textContent = err? 'Import failed — check the file.' : 'Imported '+count+' records.'; if(!err) notify('Import complete.'); });
  }},'Import Data (JSON)'));
  backupCard.appendChild(importStatus);
  wrap.appendChild(backupCard);

  const card=el('div',{class:'card'}); card.appendChild(el('h2',{},'Settings'));
  const grid=el('div',{class:'grid'});
  const feeInp=el('input',{type:'number',value:SETTINGS.admissionFee}); const dirInp=el('input',{type:'text',value:SETTINGS.directorName||'',placeholder:'e.g. Mr. A. Perera'}); const shareInp=el('input',{type:'number',value:SETTINGS.defaultShare});
  const curPwd=el('input',{type:'password',placeholder:'Current admin password'}); const newPwd=el('input',{type:'password',placeholder:'New admin password (optional)'});
  [['Default Admission Fee',feeInp],['Default Teacher Share %',shareInp],['Director Name (printed under the signature line)',dirInp],['Current Admin Password',curPwd],['New Admin Password',newPwd]].forEach(([l,i])=>{ const h=el('div');h.appendChild(el('label',{},l));h.appendChild(i);grid.appendChild(h); });
  card.appendChild(grid);
  card.appendChild(el('button',{class:'btn',onclick:()=>{
    if(curPwd.value!==SETTINGS.adminPassword){ notify('Current password incorrect'); return; }
    SETTINGS.admissionFee=feeInp.value||SETTINGS.admissionFee; SETTINGS.defaultShare=shareInp.value||SETTINGS.defaultShare; SETTINGS.directorName=dirInp.value;
    if(newPwd.value) SETTINGS.adminPassword=newPwd.value;
    const pr=saveSettings(); render(); showSavedDialog('Settings updated.', pr);
  }},'Save Settings'));
  card.appendChild(el('p',{class:'small'},'Default admin password is admin123 unless changed. This password is required to edit or delete any record.'));
  wrap.appendChild(card); return wrap;
}

render();
</script>
